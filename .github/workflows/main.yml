name: LineageOS 23 - Samsung A32 Debug (SSH)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deep SlimHub Cleanup
        uses: rokibhasansagar/slimhub_actions@main
        # This is the heavy lifter for disk space

      - name: Setup Tools & Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib \
          gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
          liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
          rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 tmate
          
          # Setup Repo Tool
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          
      - name: Start SSH Session (tmate)
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
          
